[project]
name = "cobarith"
version = "0.1.0"
description = "Where plausible Python translations of real COBOL arithmetic disagree with GnuCOBOL (AWS CardDemo)"
requires-python = ">=3.12"
dependencies = ["z3-solver==5.3.3.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
