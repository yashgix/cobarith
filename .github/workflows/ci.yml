name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y gnucobol
      - run: pip install z3-solver==5.3.3.0 ruff
      - run: make lint
      - run: make data-check
      - run: make test
